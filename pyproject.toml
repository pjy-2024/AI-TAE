[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tae"
version = "0.1.0"
description = "AI 智能测试辅助引擎：接口用例自动生成 -> UI 失败自愈 -> 真Bug/Flaky 判定（当前为骨架阶段）"
readme = "README.md"
requires-python = ">=3.10"
# 运行时依赖。开发/测试依赖在 requirements-dev.txt（与运行时分离，避免污染生产安装）。
dependencies = [
  "openai>=1.30",      # OpenAI 兼容接口（DeepSeek/Qwen 都走它，供应商无关）
  "pyyaml>=6.0",       # OpenAPI YAML 解析
  "requests>=2.31",    # V1 生成用例的执行依赖（接口测试）
  "pydantic>=2.5",     # LLM 输出的结构化校验
  "python-dotenv>=1.0" # .env 加载
]

[project.scripts]
aiae = "aiae.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]